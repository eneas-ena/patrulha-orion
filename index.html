<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0a1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fliperama">
<title>Fliperama Vidas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&family=Doto:wght@700;900&family=Michroma&display=swap">
<style>
/* Layout: duas fichas de mesa lado a lado (empilhadas no celular), sobre um fundo de fliperama escuro. */
:root{--bg:#e7e3ef;--panel:#f7f5fb;--line:#cfc8dc;--fg:#1d1733;--muted:#5d5675;--accent:#9a5a00;--dmd-bg:#160d02;--dmd:#ffb52e;
  --display:'Michroma','Chakra Petch',system-ui,sans-serif;--body:'Chakra Petch',system-ui,sans-serif;--dot:'Doto','Courier New',monospace;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0a1c;--panel:#15132e;--line:#2e2a55;--fg:#ece9ff;--muted:#a49ec8;--accent:#ffc83d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0a1c;--panel:#15132e;--line:#2e2a55;--fg:#ece9ff;--muted:#a49ec8;--accent:#ffc83d;color-scheme:dark}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 var(--body);min-height:100vh}
main{max-width:980px;margin:0 auto;padding-block:24px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.marquee{flex:1;min-width:0;background:var(--dmd-bg);color:var(--dmd);border-radius:6px;padding:10px 14px;box-shadow:inset 0 0 18px #000}
.marquee h1{margin:0;font:900 clamp(26px,5vw,40px)/1 var(--dot);letter-spacing:.04em}
.marquee p{margin:4px 0 0;font:700 14px var(--dot)}
.tools{display:flex;gap:8px;align-items:center}
button{font:600 13.5px var(--body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 11px;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.icon{width:36px;height:36px;padding:0;display:grid;place-items:center}.icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.tables{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.table{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;padding:14px;border-radius:10px;text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--panel);transition:transform .15s}
.table:hover{transform:translateY(-2px)}
.table img{width:120px;aspect-ratio:620/1040;object-fit:cover;border-radius:60px 60px 6px 6px;display:block;max-width:100%}
.table.lock,.table.soon{cursor:default}.table.lock img,.table.soon .ph{filter:grayscale(1) brightness(.55)}
.table.lock:hover,.table.soon:hover{transform:none}
.ph{width:120px;aspect-ratio:620/1040;border-radius:60px 60px 6px 6px;background:linear-gradient(160deg,var(--line),var(--panel));display:grid;place-items:center;font:400 13px var(--display);color:var(--muted);text-align:center;padding:8px;box-sizing:border-box;max-width:100%}
.lvl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.need{font-size:13.5px;color:var(--fg);border-left:3px solid var(--accent);padding-left:8px;margin-top:8px}
.badge{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted);margin-left:6px;vertical-align:2px}
.table h2{margin:2px 0 6px;font:400 19px/1.2 var(--display);text-wrap:balance}
.orion h2{color:#ffb52e}.apocalipse h2,.arca h2,.davi h2,.jerico h2{color:var(--accent)}
:root:not([data-theme="dark"]) .orion h2{color:#b85f00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .orion h2{color:#ffb52e}}
.table p{margin:0 0 10px;color:var(--muted)}
.stat{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.rec{font:900 22px var(--dot);font-variant-numeric:tabular-nums;color:var(--fg)}
.play{display:inline-block;margin-top:10px;font:13px var(--display);color:var(--accent)}

.nv-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}.nv-wrap>p{grid-column:1/-1;margin:0}
.nv-panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px;align-content:start;min-width:0}
.nv-title{margin:0;font:400 15px var(--display);color:var(--accent)}
footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px}
#toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--panel);border:1px solid var(--accent);border-radius:8px;padding:8px 12px;display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){.table{transition:none}}
</style>
</head>
<body>
<main>
  <header>
    <div class="marquee"><h1>FLIPERAMA</h1><p>Igreja Vidas · escolha a sua mesa</p></div>
    <div class="tools"><button id="btnTheme" class="icon" aria-label="Alternar modo claro e escuro"></button><button id="btnUpdate">Atualizar app</button></div>
  </header>
  <section class="tables" id="mesas" aria-label="Mesas, da mais fácil para a mais difícil"></section>
  <div id="nuvem" class="nv-wrap"></div>
  <footer><span>Os recordes da ficha ficam salvos neste aparelho; o ranking online vale para todos.</span><span id="ver"></span></footer>
</main>
<div id="toast" hidden><span>Há uma versão nova.</span><button id="btnToast">Atualizar agora</button></div>
<script>
const VERSAO = '1.5.1';
const $=id=>document.getElementById(id);
const get=(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
$('ver').textContent='v'+VERSAO;
// Níveis: cada mesa abre quando o jogador chega à patente pedida na mesa anterior (ou se o administrador liberar)
const MESAS=[
 {id:'arca',key:'arca',nome:'A Arca de Noé',nivel:'Nível 1 · Bem fácil',desc:'Para as crianças: bola lenta, saídas fechadas e muitos animais para levar à Arca.',pronta:true,abre:2,img:'mesa-arca.jpg',arquivo:'arca.html',ranks:['Grumete','Ajudante','Tratador','Carpinteiro','Marinheiro','Timoneiro','Capitão','Amigo de Noé']},
 {id:'davi',key:'davi',nome:'Davi e Golias',nivel:'Nível 2 · Fácil para médio',desc:'Recolha as cinco pedras lisas e derrube o gigante.',pronta:true,abre:3,img:'mesa-davi.jpg',arquivo:'davi.html',ranks:['Pastor de ovelhas','Harpista','Escudeiro','Soldado','Capitão de mil','Valente','Ungido','Rei de Israel']},
 {id:'jerico',key:'jerico',nome:'Muralhas de Jericó',nivel:'Nível 3 · Médio',desc:'Rodeie a cidade sete vezes e veja as muralhas caírem.',pronta:true,abre:3,img:'mesa-jerico.jpg',arquivo:'jerico.html',ranks:['Recruta','Espia','Levita','Trombeteiro','Sacerdote','Capitão','Comandante','Herói de Josué']},
 {id:'apocalipse',key:'apoc',nome:'Apocalipse',nivel:'Nível 4 · Médio para difícil',desc:'“Vi o céu aberto, e eis um cavalo branco.” De Peregrino a Cavaleiro Branco.',pronta:true,abre:4,img:'mesa-apocalipse.jpg',arquivo:'apocalipse.html',ranks:['Peregrino','Servo','Testemunha','Fiel','Vencedor','Sacerdote','Rei','Cavaleiro Branco']},
 {id:'orion',key:'orion',nome:'Patrulha Órion',nivel:'Nível 5 · Difícil · a meta',desc:'Missões no espaço, de Cadete a Almirante de Frota. “Aquele que fez o Sete-estrelo e o Órion” (Am 5.8).',pronta:true,abre:null,img:'mesa-orion.jpg',arquivo:'orion.html',ranks:['Cadete','Alferes','Tenente','Capitão','Comandante','Comodoro','Almirante','Almirante de Frota']}];
let PROG=null; // progresso vindo do ranking online (quando o jogador entrou)
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function melhor(m){const loc=+get(m.key+'-patente',-1);const srv=PROG&&PROG.mesas&&PROG.mesas[m.id]?PROG.mesas[m.id].patente:-1;return Math.max(isNaN(loc)?-1:loc,srv)}
function jogou(m){return (+get(m.key+'-recorde',0)||0)>0||!!(PROG&&PROG.mesas&&PROG.mesas[m.id])}
// o administrador (depois de entrar com e-mail e senha neste aparelho) vê todas as mesas liberadas
function adm(){try{return localStorage.getItem('fliper-adm')==='1'}catch(e){return false}}
function render(){const el=$('mesas');el.textContent='';let anterior=null;const ADM=adm();if(ADM){const n=document.createElement('p');n.className='admnote';n.style.cssText='grid-column:1/-1;margin:0;color:var(--muted);font-size:13px';n.textContent='Administrador: todas as mesas prontas estão liberadas neste aparelho.';el.appendChild(n)}
  MESAS.forEach((m,i)=>{let estado='open',falta='';
    if(!m.pronta)estado='soon';
    else if(anterior&&!(ADM||melhor(anterior)>=anterior.abre||jogou(m)||(PROG&&(PROG.liberadas||[]).includes(m.id)))){estado='lock';falta=`Para abrir: chegue a <b>${esc(anterior.ranks[anterior.abre])}</b> na mesa ${esc(anterior.nome)}. Sua melhor patente lá: ${melhor(anterior)>=0?esc(anterior.ranks[melhor(anterior)]):'nenhuma ainda'}.`}
    const rec=(+get(m.key+'-recorde',0)||0).toLocaleString('pt-BR');
    const tag=estado==='open'?'a':'div';const card=document.createElement(tag);card.className=`table ${m.id} ${estado}`;if(estado==='open')card.href=m.arquivo;
    card.innerHTML=`${m.img?`<img src="${m.img}" alt="Mesa ${esc(m.nome)}">`:`<div class="ph">${estado==='soon'?'Em construção':''}</div>`}
      <div><div class="lvl">${esc(m.nivel)}</div><h2>${esc(m.nome)}${estado==='lock'?'<span class="badge">trancada</span>':estado==='soon'?'<span class="badge">em breve</span>':''}</h2><p>${esc(m.desc)}</p>
      ${estado==='open'?`<div class="stat">Seu recorde</div><div class="rec">${rec}</div><span class="play">Jogar →</span>`:estado==='lock'?`<p class="need">${falta}</p>`:`<p class="need">Esta mesa ainda está sendo construída.</p>`}</div>`;
    el.appendChild(card);if(m.pronta)anterior=m})}
render();
window.addEventListener('nuvem-progresso',e=>{PROG=e.detail;render()});
window.addEventListener('nuvem-admin',render);
const SUN='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6L19 19M5 19l1.4-1.4M17.6 6.4L19 5"/></svg>',MOON='<svg viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>';
const cur=()=>{const a=document.documentElement.getAttribute('data-theme');return a||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')};
const t0=get('orion-tema','');if(t0==='dark'||t0==='light')document.documentElement.setAttribute('data-theme',t0);
const paint=()=>{$('btnTheme').innerHTML=cur()==='dark'?SUN:MOON};paint();
$('btnTheme').addEventListener('click',()=>{const n=cur()==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);set('orion-tema',n);paint()});
async function refresh(){try{if(window.caches){const k=await caches.keys();await Promise.all(k.map(n=>caches.delete(n)))}}catch(e){}
  try{if(navigator.serviceWorker){const r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(x=>x.unregister()))}}catch(e){}location.reload()}
$('btnUpdate').addEventListener('click',refresh);$('btnToast').addEventListener('click',refresh);
async function check(){try{const r=await fetch(location.href,{cache:'no-store'});if(!r.ok)return;const m=(await r.text()).match(/const VERSAO = '([^']+)'/);if(m&&m[1]!==VERSAO)$('toast').hidden=false}catch(e){}}
check();setInterval(check,300000);
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
<script src="nuvem.js?v=1.5.1"></script>
</body>
</html>
